schemaVersion: v0.2
prepare:
  steps:
    - command: sudo n 18.18
    - command: sudo npm -g install pnpm
    - command: pnpm install
test:
  steps: []
run:
  bolt:
    steps:
      - command: sudo n 18.18
      - command: sudo npm -g install pnpm
      - command: NODE_OPTIONS="--max-old-space-size=12288" OLLAMA_API_BASE_URL=http://ws-server-$WORKSPACE_ID-ollama.workspaces:3000 pnpm dev --host 0.0.0.0 --port 3000
    plan: 10
    replicas: 1
    isPublic: true
    network:
      path: /
      stripPath: false
  ollama:
    steps:
      - command: nix-env -iA nixpkgs.ollama
      - command: OLLAMA_HOST=0.0.0.0:3000 OLLAMA_MODELS=/home/user/app/ollama_models
          ollama serve &
      - command: sleep 5
      - command: OLLAMA_HOST=0.0.0.0:3000 OLLAMA_MODELS=/home/user/app/ollama_models
          ollama pull deepseek-coder-v2
      - command: while true; do sleep 5; done
    plan: 10
    replicas: 1
    isPublic: true
    network:
      path: /ollama
      stripPath: true
